<!doctype html>
<html lang="ru" data-ytmq-enabled="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue Actions — тестовый стенд</title>
  <link rel="stylesheet" href="fixture.css">
  <link rel="stylesheet" href="../../src/content/queue.css">
  <script defer src="fixture.js"></script>
  <script defer src="../../src/shared/preferences.js"></script>
  <script defer src="../../src/content/youtube-adapter.js"></script>
  <script defer src="../../src/content/volume.js"></script>
  <script defer src="../../src/content/playlist-store.js"></script>
  <script defer src="../../src/content/queue.js"></script>
</head>
<body>
  <ytmusic-app>
  <main>
    <h1>Проверка кнопок очереди</h1>
    <p>Смоделированные компоненты YouTube Music. Запросов к вашему аккаунту нет.</p>
    <div class="tools">
      <button id="toggle">Выключить</button>
      <button id="narrow">Узкая панель</button>
      <button id="replace">Заменить данные первой строки</button>
      <button id="reorder">Переставить строки</button>
      <button id="fail">Ошибка следующего запроса</button>
      <button id="guest">Выйти из аккаунта</button>
      <label>Плейлист <select id="playlist"><option value="">Не выбран</option><option value="PL_fixture_music">music</option><option value="PL_fixture_later">listen later</option></select></label>
      <label>Модификатор <select id="modifier"><option value="shift">Shift</option><option value="ctrl">Ctrl</option><option value="alt">Alt</option></select></label>
      <button id="delete-playlist">Удалить плейлист music</button>
    </div>
    <p id="requests" role="status">Запросов: 0 · Запусков песни: 0</p>
    <section id="panel" aria-label="Очередь">
      <h2>UP NEXT</h2>
      <ytmusic-player-queue></ytmusic-player-queue>
    </section>
    <ytmusic-player><video class="html5-main-video" hidden></video></ytmusic-player>
    <ytmusic-player-bar>
      <div class="fixture-song">
      <span>Сейчас играет: GO AHEAD</span>
      <ytmusic-like-button-renderer></ytmusic-like-button-renderer>
      </div>
      <div id="right-controls">
        <tp-yt-paper-slider id="volume-slider" min="0" max="100" step="1" value="10" aria-label="Volume" role="slider" tabindex="0"></tp-yt-paper-slider>
        <div class="right-controls-buttons"><button class="volume" aria-label="Выключить звук">🔊</button></div>
        <details><summary>Ещё</summary><div class="fixture-expanded">
          <tp-yt-paper-slider id="expand-volume-slider" slot="elements" min="0" max="100" step="5" value="10" aria-label="Volume (expanded)" role="slider" tabindex="0"></tp-yt-paper-slider>
          <button id="expand-volume" aria-label="Выключить звук">🔊</button>
        </div></details>
      </div>
    </ytmusic-player-bar>
    <div class="tools">
      <button id="native-volume">Штатное изменение: 37%</button>
      <button id="replace-volume">Заменить регуляторы</button>
    </div>
    <p id="volume-status" role="status"></p>
    <p id="volume-output" role="status"></p>
  </main>
  </ytmusic-app>
</body>
</html>
