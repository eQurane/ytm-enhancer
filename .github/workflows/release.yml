name: Release

on:
  push:
    tags: ['??.??.??.????']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate extension and run tests
        run: npm run check
      - name: Package extension
        run: npm run package
      - name: Publish release with installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/ytm-enhancer-$GITHUB_REF_NAME.zip"
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file .github/release-notes.md
