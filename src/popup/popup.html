<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chromium Extension</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main>
      <p class="eyebrow">CHROMIUM EXTENSION · <span id="version"></span></p>
      <h1>Всё готово к работе</h1>
      <p class="description">Основа для вашего будущего расширения.</p>
      <label class="setting" for="enabled">
        <span>Включить расширение</span>
        <input id="enabled" type="checkbox" role="switch" disabled>
      </label>
      <p id="status" class="status" role="status">Загрузка настроек…</p>
      <button id="open-settings" type="button">Настройки</button>
    </main>
  </body>
</html>
