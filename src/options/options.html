<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки — YouTube Music Queue Actions</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="options.js"></script>
  </head>
  <body class="options">
    <main>
      <p class="eyebrow">YOUTUBE MUSIC · <span id="version"></span></p>
      <h1>Настройки</h1>
      <p class="description">Изменения сохраняются автоматически в этом браузере.</p>
      <label class="setting" for="enabled">
        <span>Включить расширение</span>
        <input id="enabled" type="checkbox" role="switch" disabled>
      </label>
      <label class="field" for="default-playlist">Плейлист по умолчанию
        <select id="default-playlist" disabled><option value="">Не выбран</option></select>
      </label>
      <button id="refresh-playlists" type="button">Обновить список плейлистов</button>
      <p id="playlist-status" class="hint" role="status"></p>
      <label class="field" for="playlist-modifier">Выбор другого плейлиста
        <select id="playlist-modifier" disabled>
          <option value="shift">Shift + клик</option>
          <option value="ctrl">Ctrl + клик</option>
          <option value="alt">Alt + клик</option>
        </select>
      </label>
      <p id="action-hint" class="hint"></p>
      <p id="status" class="status" role="status">Загрузка настроек…</p>
      <p class="hint">Переключатель сразу показывает или убирает кнопки в очереди открытых вкладок YouTube Music. Для оценок и плейлистов войдите в аккаунт YouTube Music.</p>
    </main>
  </body>
</html>
